name: Verify foundation
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --cache "$RUNNER_TEMP/pibardos-npm"
      - name: Start local Supabase (keep keys out of CI output)
        run: npm run db:start > "$RUNNER_TEMP/pibardos-db-start.log" 2>&1
      - run: npm run setup:local
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: npm run db:stop
